name: Build Vishal PO DownloadR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q Vishal-PO-DownloadR-Android-Project.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/src/main/java/com/vishal/linkopener/MainActivity.java
          test -f project/app/src/main/res/drawable/hacker_header.jpg

      - name: Set existing Hacker Edition image as app launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          RES=project/app/src/main/res
          mkdir -p "$RES/drawable-nodpi"
          # Use the image already inside the Android project; do not create a new picture.
          convert "$RES/drawable/hacker_header.jpg" -gravity center -crop 480x480+0+0 +repage -resize 432x432 "$RES/drawable-nodpi/ic_launcher_foreground.png"
          for spec in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
            dir="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "$RES/$dir"
            convert "$RES/drawable/hacker_header.jpg" -gravity center -crop 480x480+0+0 +repage -resize "${size}x${size}" "$RES/$dir/ic_launcher.png"
            cp "$RES/$dir/ic_launcher.png" "$RES/$dir/ic_launcher_round.png"
          done
          if [ -d "$RES/mipmap-anydpi-v26" ]; then
            cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black" />
              <foreground android:drawable="@drawable-nodpi/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
            cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          fi
          echo "Launcher icon assets generated from the existing Hacker Edition image."
          find "$RES" -path '*mipmap*ic_launcher*' -type f -print

      - name: Apply new red and black home header only
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -background none home_header.svg -resize 480x853! project/app/src/main/res/drawable/hacker_header.jpg
          test -s project/app/src/main/res/drawable/hacker_header.jpg

      - name: Inspect home screen source for requested header-only edit
        run: |
          echo '--- MainActivity image and status bar references ---'
          grep -n -E 'setContentView|ImageView|BitmapFactory|hacker_header|statusBar|Date|Time|TextClock|TextView|decorView|SYSTEM_UI_FLAG|addView' project/app/src/main/java/com/vishal/linkopener/MainActivity.java | head -160
          echo '--- drawable assets ---'
          file project/app/src/main/res/drawable/* 2>/dev/null || true

      - name: Apply Purchase Order PDF UI fixes
        run: python3 .github/scripts/patch_android.py

      - name: Build APK
        run: gradle --no-daemon -p project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vishal-PO-DownloadR-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
