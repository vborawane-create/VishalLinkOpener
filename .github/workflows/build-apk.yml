name: Build Vishal Link Opener APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q VishalLinkOpener-Android-Project.zip -d project
          ls -la project

      - name: Build APK
        run: gradle --no-daemon -p project assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VishalLinkOpener-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
