name: Build Vishal PO DownloadR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q Vishal-PO-DownloadR-Android-Project.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/src/main/java/com/vishal/linkopener/MainActivity.java
          test -f project/app/src/main/res/drawable/hacker_header.jpg

      - name: Inspect Android source
        run: |
          echo '=== MainActivity.java ==='
          sed -n '1,300p' project/app/src/main/java/com/vishal/linkopener/MainActivity.java
          echo '=== AndroidManifest.xml ==='
          sed -n '1,220p' project/app/src/main/AndroidManifest.xml
          echo '=== Layout and values files ==='
          find project/app/src/main/res -maxdepth 2 -type f | sort
          for f in project/app/src/main/res/layout/*.xml project/app/src/main/res/values/*.xml; do
            if [ -f "$f" ]; then echo "=== $f ==="; sed -n '1,220p' "$f"; fi
          done

      - name: Build APK
        run: gradle --no-daemon -p project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vishal-PO-DownloadR-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
